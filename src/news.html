<!doctype html>
<html lang="en" class="dark" id="htmlTag">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet" type="text/css">
    <link href="input.css" rel="stylesheet" type="text/css">
    <title>News - Ticker AI</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="bg-white dark:bg-gray-900">
    <!-- Header section -->
    <header class="md:mx-14 md:py-4 py-2 px-2 ">
        <nav class="container mx-auto flex items-center justify-between">
            <!-- logo -->
            <div class="flex items-center gap-1 md:gap-3">
                <a href="index.html">
                    <img class="w-16" src="../assets/image/tickerAI-logo.png" alt="Ticker AI">
                </a>
                <p class="dark:text-white text-[8px] md:text-xs">A Mark Cuban Company<br>
                    AI-based Financial Market News Aggregator</p>
            </div>
            <div class="flex items-center gap-2 md:gap-7 ">
                <a href="index.html">
                    <button
                        class="bg-[#5677ac] md:text-base text-xs md:py-3 py-1 md:px-6 px-2 rounded-md text-white font-semibold hover:bg-[#42669e] transition hover:scale-105 hover:translate-y-1">
                        Personalize News
                    </button>
                </a>
                <div
                    class="text-[#5677ac] bg-[#5677ac26] md:text-2xl text-lg font-bold size-9 rounded-full flex items-center justify-center hover:scale-105 transition-all cursor-pointer">
                    IK
                </div>
                <button class="cursor-pointer" id="switch">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6 dark:stroke-white hover:scale-105 transition-all duration-300">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <section class="bg-[#F0F0F0] md:px-0 px-4 w-full min-h-screen">
        <section class="container mx-auto md:py-12 py-8">
            <div class="flex items-center justify-between pb-1 md:pb-2.5 border-b md:border-b-[3px] border-black md:mx-16">
                <h3 class="md:text-2xl text-lg font-semibold uppercase text-[#333]">
                    Personolize your news
                </h3>
            </div>

            <div class="bg-white max-w-lg mx-auto md:mt-10 mt-6 p-8">
                <h3 class="font-semibold md:text-2xl text-lg text-center text-[#333]">
                    Select your Markets
                </h3>

                <div class="py-5 space-y-5">
                    <button class="news-head">Stocks</button>
                    <button class="news-head">Crypto</button>
                    <button class="news-head">Economy & Business</button>
                    <button class="news-head">Commodities | Forex</button>
                    <button class="news-head">Fixed Income</button>
                </div>
                <button class="bg-[#5677AC] w-full py-2 md:py-4 rounded-full text-white font-medium md:text-lg hover:bg-[#42669e] transition-all duration-300 hover:scale-105 cursor-pointer">
                    Continue
                </button>
            </div>
        </section>
    </section>

    <footer class="dark:text-white text-black text-center pb-5 pt-5 w-full">
        <p>
            All right reserved to TickerAI - 2026
        </p>
    </footer>


    <script>
        const htmlTag = document.getElementById("htmlTag");
        document.getElementById("switch").addEventListener("click", function () {
            htmlTag.classList.toggle("dark");
        });
    </script>
</body>

</html>
